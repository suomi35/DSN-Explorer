build:
  maxIssues: 0

complexity:
  LongMethod:
    active: true
    # Compose functions legitimately list many parameters/children.
    ignoreAnnotated: ['Composable']
    threshold: 100
  LongParameterList:
    active: true
    ignoreAnnotated: ['Composable']
    functionThreshold: 8
    constructorThreshold: 8
  TooManyFunctions:
    active: true
    thresholdInFiles: 25
    ignoreAnnotated: ['Composable']
  CyclomaticComplexMethod:
    active: true
    ignoreAnnotated: ['Composable']
    threshold: 25
  LargeClass:
    active: true
    ignoreAnnotated: ['Composable']
    threshold: 700
  NestedBlockDepth:
    active: true
    threshold: 6
  LabeledExpression:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false

naming:
  FunctionNaming:
    # Composable functions use PascalCase by convention.
    ignoreAnnotated: ['Composable']
  VariableNaming:
    ignoreAnnotated: ['Composable', 'Inject']

style:
  MagicNumber:
    active: false
  MaxLineLength:
    active: true
    maxLineLength: 140
    excludeCommentStatements: true
  ReturnCount:
    active: true
    max: 5
    excludeGuardClauses: true
  UnusedPrivateMember:
    active: true
    ignoreAnnotated: ['Composable']
  WildcardImport:
    active: false
  ForbiddenComment:
    active: false
  NewLineAtEndOfFile:
    active: true
  ForbiddenVoid:
    active: false
  UnnecessaryAbstractClass:
    active: false
  UseCheckOrError:
    active: false
  UseRequire:
    active: false
  UnusedPrivateProperty:
    active: true
    ignoreAnnotated: ['Composable']

coroutines:
  GlobalCoroutineUsage:
    active: false
  SleepInsteadOfDelay:
    active: false

empty-blocks:
  active: true

potential-bugs:
  UnsafeCallOnNullableType:
    active: false
  UnsafeCast:
    active: false